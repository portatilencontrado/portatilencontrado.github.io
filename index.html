<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }

    .password-screen {
      width: 100%;
      height: 100vh;
      background-color: #0a0e3e;
      background-image: 
        linear-gradient(30deg, #1a237e 12%, transparent 12.5%, transparent 87%, #1a237e 87.5%, #1a237e),
        linear-gradient(150deg, #1a237e 12%, transparent 12.5%, transparent 87%, #1a237e 87.5%, #1a237e),
        linear-gradient(30deg, #1a237e 12%, transparent 12.5%, transparent 87%, #1a237e 87.5%, #1a237e),
        linear-gradient(150deg, #1a237e 12%, transparent 12.5%, transparent 87%, #1a237e 87.5%, #1a237e),
        linear-gradient(60deg, #1a237e77 25%, transparent 25.5%, transparent 75%, #1a237e77 75%, #1a237e77),
        linear-gradient(60deg, #1a237e77 25%, transparent 25.5%, transparent 75%, #1a237e77 75%, #1a237e77);
      background-size: 40px 70px;
      background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      position: relative;
    }

    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-circle {
      width: 44px;
      height: 44px;
      background: #9e9e9e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      font-weight: bold;
    }

    .username {
      font-size: 42px;
      color: #e0e0e0;
      letter-spacing: 2px;
    }

    .prompt {
      font-size: 48px;
      color: #e0e0e0;
      margin-bottom: 48px;
      text-align: center;
      letter-spacing: 2px;
    }

    .input-wrapper { position: relative; }

    .password-input {
      width: 420px;
      height: 56px;
      background: #f5f5f5;
      border: 4px solid #9c27b0;
      box-shadow: 0 0 20px #9c27b0, inset 0 0 10px rgba(156, 39, 176, 0.2);
      font-family: 'VT323', monospace;
      font-size: 32px;
      padding: 0 16px;
      color: #333;
      outline: none;
      text-align: center;
      letter-spacing: 4px;
    }

    .password-input:focus {
      box-shadow: 0 0 30px #9c27b0, 0 0 60px rgba(156, 39, 176, 0.4), inset 0 0 10px rgba(156, 39, 176, 0.2);
    }

    .error-msg {
      margin-top: 24px;
      font-size: 28px;
      color: #ff1744;
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error-msg.show { opacity: 1; }

    .password-screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.08) 0px,
        rgba(0, 0, 0, 0.08) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }

    .success-screen {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e3e;
      font-family: 'VT323', monospace;
    }

    .success-screen h1 {
      color: #00e676;
      font-size: 48px;
      letter-spacing: 3px;
    }

    @media (max-width: 600px) {
      .prompt { font-size: 32px; }
      .password-input { width: 300px; height: 48px; font-size: 24px; }
      .username { font-size: 32px; }
      .icon-circle { width: 36px; height: 36px; font-size: 22px; }
    }
  </style>
</head>
<body>

  <div id="loginScreen" class="password-screen">
    <div class="header">
      <div class="icon-circle">?</div>
      <div class="username">Invitado</div>
    </div>
    <div class="prompt">Introduzca la contraseña.</div>
    <div class="input-wrapper">
      <input type="password" id="pwdInput" class="password-input" autocomplete="off" />
    </div>
    <div id="errorMsg" class="error-msg">* CONTRASEÑA INCORRECTA.</div>
  </div>

  <div id="successScreen" class="success-screen">
    <h1>ACCESO CONCEDIDO</h1>
    <!-- Tu web real va aquí -->
  </div>

  <script>
    // ========================
    // SONIDOS CON WEB AUDIO API
    // ========================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Sonido de ERROR: buzz grave + beep de rechazo
    function playErrorSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // Capa 1: Buzz grave (sawtooth)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(150, now);
      osc1.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain1.gain.setValueAtTime(0.15, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.4);

      // Capa 2: Beep agudo de error (square wave)
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(880, now);
      osc2.frequency.exponentialRampToValueAtTime(220, now + 0.2);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.25);
    }

    // Sonido de ÉXITO: ding agradable (arpegio C-E-G)
    function playSuccessSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // Nota 1: C5
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(523.25, now);
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(0.2, now + 0.05);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.8);

      // Nota 2: E5
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(659.25, now + 0.1);
      gain2.gain.setValueAtTime(0, now + 0.1);
      gain2.gain.linearRampToValueAtTime(0.15, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.1);
      osc2.stop(now + 0.9);

      // Nota 3: G5
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(783.99, now + 0.2);
      gain3.gain.setValueAtTime(0, now + 0.2);
      gain3.gain.linearRampToValueAtTime(0.12, now + 0.25);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      osc3.connect(gain3);
      gain3.connect(ctx.destination);
      osc3.start(now + 0.2);
      osc3.stop(now + 1.0);
    }

    // ========================
    // LÓGICA DE CONTRASEÑA
    // ========================
    const CORRECT_PASSWORD = 'demo'; // <-- CAMBIA ESTO

    const input = document.getElementById('pwdInput');
    const error = document.getElementById('errorMsg');
    const loginScreen = document.getElementById('loginScreen');
    const successScreen = document.getElementById('successScreen');

    function checkPassword() {
      if (input.value === CORRECT_PASSWORD) {
        playSuccessSound();
        loginScreen.style.display = 'none';
        successScreen.style.display = 'flex';
        sessionStorage.setItem('auth', 'ok');
      } else {
        playErrorSound();
        error.classList.add('show');
        input.style.borderColor = '#ff1744';
        input.style.boxShadow = '0 0 20px #ff1744, inset 0 0 10px rgba(255, 23, 68, 0.2)';
        setTimeout(() => {
          error.classList.remove('show');
          input.style.borderColor = '#9c27b0';
          input.style.boxShadow = '0 0 20px #9c27b0, inset 0 0 10px rgba(156, 39, 176, 0.2)';
          input.value = '';
          input.focus();
        }, 2000);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // Primer click para desbloquear audio (política de autoplay)
    document.getElementById('loginScreen').addEventListener('click', () => {
      getAudioContext();
    }, { once: true });

    if (sessionStorage.getItem('auth') === 'ok') {
      loginScreen.style.display = 'none';
      successScreen.style.display = 'flex';
    }

    input.focus();
  </script>

</body>
</html>
