<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #c9d1d9;
            overflow: hidden;
            position: relative;
        }

        /* Fondo de partículas sutiles */
        .bg-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, #30363d 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .hexagon-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .hexagon {
            width: 160px;
            height: 92px;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 3s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(88, 166, 255, 0.3);
        }

        .hexagon::before,
        .hexagon::after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
        }

        .hexagon::before {
            bottom: 100%;
            border-bottom: 46px solid #58a6ff;
        }

        .hexagon::after {
            top: 100%;
            border-top: 46px solid #a371f7;
        }

        /* Capa interna para gradiente continuo */
        .hexagon-inner {
            position: absolute;
            width: 152px;
            height: 88px;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hexagon-inner::before,
        .hexagon-inner::after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 76px solid transparent;
            border-right: 76px solid transparent;
        }

        .hexagon-inner::before {
            bottom: 100%;
            border-bottom: 44px solid #58a6ff;
        }

        .hexagon-inner::after {
            top: 100%;
            border-top: 44px solid #a371f7;
        }

        .hexagon-content {
            position: relative;
            z-index: 3;
            font-size: 48px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.1); }
        }

        /* Anillo orbitando */
        .orbit-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(88, 166, 255, 0.15);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .orbit-ring::before {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #58a6ff;
            border-radius: 50%;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #58a6ff;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #f0f6fc;
            margin-bottom: 12px;
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            letter-spacing: 0.05em;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }

        .github-link {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .github-link:hover {
            color: #58a6ff;
        }

        .github-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .hexagon-wrapper { width: 160px; height: 160px; }
            .hexagon { width: 120px; height: 69px; }
            .hexagon::before { border-left-width: 60px; border-right-width: 60px; border-bottom-width: 35px; }
            .hexagon::after { border-left-width: 60px; border-right-width: 60px; border-top-width: 35px; }
            .hexagon-inner { width: 114px; height: 66px; }
            .hexagon-inner::before { border-left-width: 57px; border-right-width: 57px; border-bottom-width: 33px; }
            .hexagon-inner::after { border-left-width: 57px; border-right-width: 57px; border-top-width: 33px; }
            .orbit-ring { width: 200px; height: 200px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-dots"></div>

    <div class="hexagon-wrapper">
        <div class="orbit-ring"></div>
        <div class="hexagon">
            <div class="hexagon-inner">
                <div class="hexagon-content">&#9670;</div>
            </div>
        </div>
    </div>

    <h1>COMING SOON</h1>
    <p>Estamos construyendo algo increíble.<br>¡Vuelve pronto!</p>

</body>
</html>
